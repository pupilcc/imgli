name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: write

# Never cancel an in-flight release for the same tag.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # --- Binary / install.sh path (img.li production uses this) ---
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install web dependencies
        working-directory: web
        run: npm ci --no-fund --no-audit

      - uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Binary available (summary)
        run: |
          {
            echo "## Binaries ready"
            echo ""
            echo "Tag **${{ github.ref_name }}** GitHub Release assets are published."
            echo ""
            echo "Production (img.li / baili) can deploy now — no need to wait for multi-arch Docker:"
            echo ""
            echo '```bash'
            echo "./scripts/ops-deploy-baili.sh ${{ github.ref_name }}"
            echo "./scripts/ops-smoke-public.sh https://img.li"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # Prove GitHub Release binary boots (same path as install.sh / production baili).
  smoke-binary:
    runs-on: ubuntu-latest
    needs: [goreleaser]
    steps:
      - uses: actions/checkout@v5

      - name: Download Linux amd64 release binary
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="${{ github.ref_name }}"
          asset="imgli_${tag#v}_Linux_x86_64.tar.gz"
          gh release download "$tag" --pattern "$asset" --dir /tmp/imgli-rel
          tar -xzf "/tmp/imgli-rel/$asset" -C /tmp/imgli-rel
          # archive layout: imgli binary at top or nested
          bin="$(find /tmp/imgli-rel -type f -name imgli | head -1)"
          test -n "$bin"
          chmod +x "$bin"
          echo "BIN=$bin" >> "$GITHUB_ENV"
          "$bin" version

      - name: Install-path smoke (binary)
        run: |
          chmod +x scripts/ops-smoke-install.sh
          ./scripts/ops-smoke-install.sh binary "$BIN"

      - name: Smoke binary summary
        if: success()
        run: |
          {
            echo "## Binary install smoke PASS"
            echo ""
            echo "Downloaded Release asset, ran serve, register + upload + GET object."
          } >> "$GITHUB_STEP_SUMMARY"

  # --- Fast Docker path: amd64 first so `docker pull :tag` works sooner ---
  docker-amd64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata (amd64)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern=v{{version}}
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}

      # GHCR push can hit secondary rate limits (403) even after a successful build
      # (v0.9.10). One cooldown + retry usually clears it; GHA cache keeps rebuild cheap.
      - name: Build and push (amd64)
        id: push_amd64
        continue-on-error: true
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          build-args: |
            VERSION=${{ github.ref_name }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Cooldown before GHCR push retry
        if: steps.push_amd64.outcome == 'failure'
        run: |
          echo "amd64 push failed (often GHCR secondary rate limit); waiting 2m then retry"
          sleep 120

      - name: Build and push (amd64 retry)
        if: steps.push_amd64.outcome == 'failure'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          build-args: |
            VERSION=${{ github.ref_name }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: amd64 image available (summary)
        run: |
          {
            echo "## Docker amd64 ready"
            echo ""
            echo '```bash'
            echo "docker pull ghcr.io/${{ github.repository }}:${{ github.ref_name }}"
            echo '```'
            echo ""
            echo "Multi-arch (arm64+amd64) continues in job **docker-multi**."
            echo "Install smoke runs in job **smoke-docker** (named volume + bind mount)."
          } >> "$GITHUB_STEP_SUMMARY"

  # Prove the published amd64 image actually boots and serves a full user journey
  # (healthz + SPA + register + upload + GET /i/...). Named volume + bind mount.
  smoke-docker:
    runs-on: ubuntu-latest
    needs: [docker-amd64]
    steps:
      - uses: actions/checkout@v5

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install-path smoke (Docker)
        run: |
          chmod +x scripts/ops-smoke-install.sh
          ./scripts/ops-smoke-install.sh docker "ghcr.io/${{ github.repository }}:${{ github.ref_name }}"

      - name: Smoke docker summary
        if: success()
        run: |
          {
            echo "## Docker install smoke PASS"
            echo ""
            echo "Named volume + bind-mount: healthz, SPA, first-user register, upload, object GET."
          } >> "$GITHUB_STEP_SUMMARY"

  # --- Full multi-arch (overwrites tag manifests when done) ---
  docker-multi:
    runs-on: ubuntu-latest
    needs: [docker-amd64]
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata (multi)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern=v{{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          build-args: |
            VERSION=${{ github.ref_name }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Multi-arch complete (summary)
        run: |
          {
            echo "## Docker multi-arch ready"
            echo ""
            echo "linux/amd64 + linux/arm64 manifests published for **${{ github.ref_name }}**."
          } >> "$GITHUB_STEP_SUMMARY"
