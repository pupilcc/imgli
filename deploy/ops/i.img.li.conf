# img.li media CDN origin — reverse proxy to local RustFS bucket imgli
# Host: Hosthatch openresty (host network) → 127.0.0.1:9000/imgli/
# Deploy path: /opt/1panel/www/conf.d/i.img.li.conf  then nginx -t && nginx -s reload
# Public /i 302 targets: https://i.img.li/{object-key}
# Requires: RustFS bucket imgli anonymous policy = download
server {
    listen 80;
    listen [::]:80;
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name i.img.li;

    include /usr/local/openresty/nginx/conf/ssl/root_ssl.conf;

    location = / {
        default_type text/plain;
        return 404 "img.li media\n";
    }

    location / {
        # strip client auth; rely on bucket anonymous download policy
        proxy_set_header Authorization "";
        proxy_set_header Host 127.0.0.1:9000;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_http_version 1.1;
        proxy_buffering on;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
        proxy_pass http://127.0.0.1:9000/imgli/;

        expires 30d;
        add_header Cache-Control "public, max-age=2592000" always;
        add_header X-Content-Type-Options nosniff always;

        proxy_hide_header x-amz-request-id;
        proxy_hide_header x-amz-id-2;
        proxy_hide_header x-request-id;
        proxy_hide_header Server;
    }
}
