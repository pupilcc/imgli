# img.li 预签名直连域 —— 私密图 302 的签名目标
# Host: Hosthatch openresty 容器 (host network) → 127.0.0.1:9000
# 2026-07-23 已部署并真机验证:LE 证书 CN=s3.img.li;经此域 A/B/C/D 判据全过。
#
# 部署方式(Hosthatch 无真 SSH,仅只读 probe;经 openresty 容器 rw 挂载写入):
#   docker exec 1Panel-openresty-* 写入本文件到 conf.d/ 与证书到 ssl/s3.img.li/,
#   容器内 nginx -t && nginx -s reload。conf.d 与 ssl 目录都是容器 rw 绑定挂载。
# TLS 证书:npc cert(acme_dns01)签发到宿主 /tmp/s3img-ssl/,再拷进容器 ssl 目录。
#   续期告警:npc 托管续期写 /tmp,不会自动更新容器内副本——到期(约 90 天)前需
#   重跑「拷贝证书进容器 + reload」。
#
# 与 i.img.li 的关键差异(都是签名能否通过的必要条件):
#   1. 不重写 path —— SigV4 签名覆盖 URI path,重写即校验失败。
#      故 proxy_pass 末尾无路径段,对象键含 bucket 前缀由签名方拼好。
#   2. DNS 走 Cloudflare 灰云 —— 橙云会缓存带签名的响应,可能跨用户串号。
#   3. 不加 expires/Cache-Control —— 签名 60s 失效,任何缓存都是错的。
#   4. Host 透传 —— SigV4 把 Host 纳入签名,PresignGet 签的是 s3.img.li;
#      若像 i.img.li 那样改写成 127.0.0.1:9000,上游 RustFS 重算即 403。
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name s3.img.li;

    # 灰云直连,浏览器直接校验此证书 —— 必须是浏览器信任的真证书(非自签 root_ssl.conf)
    ssl_certificate     /usr/local/openresty/nginx/conf/ssl/s3.img.li/fullchain.pem;
    ssl_certificate_key /usr/local/openresty/nginx/conf/ssl/s3.img.li/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    location = / {
        default_type text/plain;
        return 404 "img.li presign origin\n";
    }

    location / {
        # 不清 Authorization:预签名走 query 参数,但保留头透传以兼容将来的
        # header 签名场景。
        # 绝不能像 i.img.li 那样改写 Host:SigV4 签名覆盖 Host,PresignGet 签的是
        # s3.img.li;改写成 127.0.0.1:9000 后上游 RustFS 用收到的 Host 重算
        # canonical request,必然与 X-Amz-Signature 对不上 → 全量 403。
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        proxy_http_version 1.1;
        proxy_buffering on;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;

        # 注意末尾无路径段 —— 保持 URI 原样转发,签名才能校验通过
        proxy_pass http://127.0.0.1:9000;

        add_header Cache-Control "private, no-store" always;
        add_header X-Content-Type-Options nosniff always;

        proxy_hide_header x-amz-request-id;
        proxy_hide_header x-amz-id-2;
        proxy_hide_header x-request-id;
        proxy_hide_header Server;
    }
}
