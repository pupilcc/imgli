services:
  imgli:
    # 从源码构建时走 Dockerfile（默认 -tags vips + 运行时 libvips）。
    # 生产可改为预构建镜像并固定 tag:
    # image: ghcr.io/yixian-huang/imgli:v0.1.0
    build: .
    ports:
      - "8686:8686"
    environment:
      # 浏览器实际访问的公网源；外链/邮件、Secure Cookie、CSRF Origin 白名单均依赖它。
      # 反代到域名时务必改为 https://你的域名，否则登录注册可能 403「跨站请求被拒绝」。
      IMGLI_BASE_URL: http://localhost:8686
      # 反代(nginx/caddy/1Panel)后面部署时打开:
      # IMGLI_TRUST_PROXY: "true"
      # 用 Postgres 替代默认 SQLite 时:
      # IMGLI_DATABASE_DRIVER: postgres
      # IMGLI_DATABASE_DSN: host=db user=imgli password=imgli dbname=imgli port=5432 sslmode=disable
    volumes:
      - imgli-data:/data
    restart: unless-stopped

volumes:
  imgli-data:
